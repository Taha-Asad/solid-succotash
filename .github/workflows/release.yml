# ==========================================
# GitHub Actions — Auto-build and Release
# ==========================================
#
# When you push a version tag (v0.1.0, v0.2.0, etc.),
# this workflow automatically:
#   1. Builds the Windows .exe installer
#   2. Creates a GitHub Release
#   3. Uploads the installer as a release asset
#   4. Generates and uploads the updater's latest.json
#
# Your app's updater checks GitHub Releases for new versions.
#
# Why the custom latest.json step?
# The product name contains "&" and spaces, so GitHub normalizes the
# uploaded asset names (e.g. "Ijaz & Company ERP_...exe" becomes
# "Ijaz.Company.ERP_...exe"). tauri-action compares the local artifact
# name against the uploaded name to find the signature, the names never
# match, and it silently skips latest.json. This step generates the file
# from the assets that were actually uploaded, so it works for any
# product name.
#
# TRIGGER: Push a tag like "v0.1.0"
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Ijaz & Company ERP v__VERSION__"
          releaseBody: |
            ## What's New
            - See the changelog for details

            ## Installation
            Download the `.exe` installer below and run it.
            Your data is preserved — no need to uninstall the previous version.
          releaseDraft: false
          prerelease: false

      - name: Generate and upload updater latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $tag = "${{ github.ref_name }}"
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag"
          $exe = $release.assets | Where-Object { $_.name -like "*.exe" -and $_.name -notlike "*.exe.sig" } | Select-Object -First 1
          $sig = $release.assets | Where-Object { $_.name -like "*.exe.sig" } | Select-Object -First 1
          if (-not $exe -or -not $sig) {
            throw "Installer/signature asset not found in release $tag"
          }
          $signature = [System.Net.WebClient]::new().DownloadString($sig.browser_download_url).Trim()
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $payload = [ordered]@{
            version   = $version
            notes     = $release.body
            pub_date  = $release.published_at
            platforms = [ordered]@{
              "windows-x86_64"      = [ordered]@{ signature = $signature; url = $exe.browser_download_url }
              "windows-x86_64-nsis" = [ordered]@{ signature = $signature; url = $exe.browser_download_url }
            }
          }
          $jsonPath = Join-Path $env:RUNNER_TEMP "latest.json"
          $payload | ConvertTo-Json -Depth 6 | Set-Content -Path $jsonPath -Encoding UTF8
          Invoke-RestMethod -Method Post -Headers $headers -ContentType "application/json" `
            -Uri "$api/releases/$($release.id)/assets?name=latest.json" `
            -InFile $jsonPath | Out-Null
          Write-Host "Uploaded latest.json (version $version)"
